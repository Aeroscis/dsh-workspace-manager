  en: 'Sidebar workspace management for DeepSeek Harness: raises the workspace you last prompted, pins, drag-to-reorder, name filtering, one-click tidy, empty-workspace cleanup, and moving a workspace folder to a new path with its conversations carried over.'
  zh: 'DSH 侧栏工作区管理：最后发过消息的工作区自动上浮，支持置顶、拖拽排序、按名称筛选、一键整理、清理空工作区，以及把工作区文件夹连对话一起迁到新路径。'
