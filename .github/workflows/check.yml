name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 这个插件没有依赖（运行时是浏览器 bundle，由宿主加载），所以不用装包。
      # 全部离线：不访问 registry、不跑构建脚本。
      # 拆成两步：只看 exit code 的分不出是逻辑测试炸了还是打包/元数据炸了。
      - name: 逻辑测试
        run: npm test

      - name: 发布形态自检与打包
        run: node scripts/check-release.mjs && npm pack --dry-run

      # 宿主接口检查要读本机装的 DSH 才能判定，CI 上没有宿主，此时脚本必须以
      # 「无法判定」(30) 退出，而不是当成通过。这条就是验证这件事。
      # 真实判定在开发机上由 npm run compat 完成。
      - name: 没有宿主时宿主接口检查不得报通过
        run: |
          set +e
          DSH_APP_ROOT=/nonexistent DSH_APP_ASAR=/nonexistent node scripts/compat-probe.mjs
          status=$?
          set -e
          test "$status" -eq 30
