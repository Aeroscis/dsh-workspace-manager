name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 这个插件没有依赖（运行时是浏览器 bundle，由宿主加载），所以不用装包。
      # 全部离线：不访问 registry、不跑构建脚本。
      # 拆成两步：只看 exit code 的分不出是逻辑测试炸了还是打包/元数据炸了。
      - name: 逻辑测试
        run: npm test

      - name: 发布形态自检与打包
        run: node scripts/check-release.mjs && npm pack --dry-run
