name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 这个插件没有依赖（运行时是浏览器 bundle，由宿主加载），所以不用装包。
      # check = 发布形态自检 + 三个逻辑测试 + npm pack --dry-run，全部离线：
      # 不访问 registry、不跑构建脚本，任何网络环境下都稳。
      - run: npm run check
